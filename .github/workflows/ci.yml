# Public CI. It runs against synthetic fixtures only and has no access to the
# household, to Tailscale, or to any vendor credential; see
# docs/security/threat-model.md. Never add a self-hosted runner here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        # Hardware markers never run here.
        run: uv run pytest -q -m "not hardware"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The official image, pinned. The gitleaks GitHub Action is avoided on
      # purpose: it fails the job trying to upload a report that gitleaks does
      # not write when there is nothing to report, and it is one more
      # third-party action with access to the workflow.
      - name: gitleaks
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /repo
        run: |
          docker run --rm             -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0             -v "${{ github.workspace }}:/repo"             zricethezav/gitleaks:v8.24.3             detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Audit installed packages
        run: |
          uv sync
          uvx pip-audit --strict --progress-spinner off
